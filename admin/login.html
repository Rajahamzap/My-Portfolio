<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main class="lg"><div class="lgb">
<div class="brand"><i>RH</i>Admin Panel</div>
<form id="lf"><h1>Sign in</h1><p class="s">Manage your portfolio website.</p><div id="lm" role="alert"></div>
<label for="em">Email</label><input id="em" type="email" autocomplete="username" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button class="btn pri" id="lb" type="submit" style="width:100%;justify-content:center;margin-top:20px">Sign in</button><p style="margin-top:16px;text-align:center"><a href="#" id="fg" style="color:var(--accd)">Forgot your password?</a></p></form>
<form id="ff" hidden><h1>Reset password</h1><p class="s">Enter your admin email to receive a reset link.</p><div id="fm" role="status"></div><label for="fe">Email</label><input id="fe" type="email" autocomplete="username" required>
<button class="btn pri" type="submit" style="width:100%;justify-content:center;margin-top:20px">Send reset link</button><p style="margin-top:16px;text-align:center"><a href="#" id="bk" style="color:var(--accd)">Back to sign in</a></p></form>
</div></main><script src="/admin/login.js"></script></body></html>
